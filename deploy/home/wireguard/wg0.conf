# =============================================================
# WireGuard конфигурация — Home (Proxmox хост или выделенная VM/LXC)
# Файл: /etc/wireguard/wg0.conf на домашнем сервере
# =============================================================
#
# Этот узел слушает входящие соединения от VPS.
# Home получает адрес 10.0.0.2 в туннельной сети.
#
# Перед использованием замените плейсхолдеры:
#   HOME_PRIVATE_KEY  — приватный ключ домашнего сервера (wg genkey)
#   VPS_PUBLIC_KEY    — публичный ключ VPS
#
# На домашнем роутере необходим проброс:
#   UDP 51820 (внешний) → IP_этого_сервера:51820 (внутренний)

[Interface]
Address = 10.0.0.2/24
ListenPort = 51820
PrivateKey = HOME_PRIVATE_KEY

# Маршрутизация трафика из туннеля в локальную сеть Proxmox (к NPM LXC)
# Замените eth0 на имя вашего сетевого интерфейса (ip a — чтобы узнать)
PostUp = iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -o eth0 -j MASQUERADE
PostUp = sysctl -w net.ipv4.ip_forward=1
PostDown = iptables -t nat -D POSTROUTING -s 10.0.0.0/24 -o eth0 -j MASQUERADE

[Peer]
# VPS (194.58.114.184)
PublicKey = VPS_PUBLIC_KEY
AllowedIPs = 10.0.0.1/32
