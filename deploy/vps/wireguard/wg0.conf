# =============================================================
# WireGuard конфигурация — VPS (Edge Proxy)
# Файл: /etc/wireguard/wg0.conf на VPS (194.58.114.184)
# =============================================================
#
# Этот узел инициирует соединение к домашнему серверу.
# VPS получает адрес 10.0.0.1 в туннельной сети.
#
# Перед использованием замените плейсхолдеры:
#   VPS_PRIVATE_KEY   — приватный ключ VPS (wg genkey)
#   HOME_PUBLIC_KEY   — публичный ключ домашнего сервера
#   HOME_STATIC_IP    — статический публичный IP домашнего интернета
#
# Генерация ключей (выполнить на VPS):
#   wg genkey | tee /etc/wireguard/vps_privatekey | wg pubkey > /etc/wireguard/vps_publickey
#
# Генерация ключей (выполнить на Home):
#   wg genkey | tee /etc/wireguard/home_privatekey | wg pubkey > /etc/wireguard/home_publickey

[Interface]
Address = 10.0.0.1/24
PrivateKey = VPS_PRIVATE_KEY
# Порт не указываем — VPS выступает клиентом, исходящее соединение

[Peer]
# Домашний сервер (Proxmox)
PublicKey = HOME_PUBLIC_KEY
Endpoint = HOME_STATIC_IP:51820
AllowedIPs = 10.0.0.2/32
# Поддерживать туннель активным (важно для NAT на домашнем роутере)
PersistentKeepalive = 25
