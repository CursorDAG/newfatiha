# =============================================================
# Nginx Edge Proxy — VPS (194.58.114.184)
# Файл: /etc/nginx/sites-available/multi-proxy.conf
# =============================================================
#
# Мульти-доменный reverse proxy, перенаправляющий весь трафик
# через WireGuard туннель на Nginx Proxy Manager дома.
#
# Чтобы добавить новый домен:
#   1. Добавьте домен в server_name (в обоих блоках: HTTP и HTTPS)
#   2. Получите сертификат: certbot --nginx -d new-domain.ru
#   3. Настройте маршрут в NPM дома
#
# После первой установки запустите:
#   certbot --nginx -d fatiha.ru -d www.fatiha.ru
# Certbot автоматически добавит ssl_certificate директивы.

# --- Upstream: домашний NPM через WireGuard ---
upstream home_npm {
    server 10.0.0.2:80;
    keepalive 32;
}

# --- HTTP → HTTPS редирект + ACME challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name fatiha.ru www.fatiha.ru other-site.ru;

    # Let's Encrypt ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS основной блок ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fatiha.ru www.fatiha.ru other-site.ru;

    # SSL-сертификаты (certbot заполнит автоматически)
    # ssl_certificate /etc/letsencrypt/live/fatiha.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fatiha.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Размер тела запроса (загрузка файлов) ---
    client_max_body_size 50M;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Буферы для проксирования ---
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- Логирование ---
    access_log /var/log/nginx/proxy-access.log;
    error_log /var/log/nginx/proxy-error.log;

    # --- WebSocket для Socket.io ---
    location /socket.io/ {
        proxy_pass http://home_npm/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Критично для WebSocket — отключить буферизацию
        proxy_buffering off;
        proxy_cache off;

        # Длинные таймауты для persistent-соединений
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Статика Next.js (кешируемая) ---
    location /_next/static/ {
        proxy_pass http://home_npm/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # --- Все остальные запросы ---
    location / {
        proxy_pass http://home_npm;
        proxy_http_version 1.1;

        # Поддержка WebSocket для остальных путей (Next.js HMR и т.д.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реальных данных клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
