user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Client body size (для загрузки файлов)
    client_max_body_size 10M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Upstream - Next.js app
    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect (раскомментируйте когда настроите SSL)
    # server {
    #     listen 80;
    #     server_name fatiha.ru www.fatiha.ru;
    #
    #     # Let's Encrypt challenge
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #
    #     location / {
    #         return 301 https://$server_name$request_uri;
    #     }
    # }

    # HTTP server (для тестирования без SSL)
    server {
        listen 80;
        server_name _;

        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket для Socket.io
        location /socket.io/ {
            proxy_pass http://nextjs/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        # Static assets - cache for 1 year (Next.js handles hashed filenames)
        location /_next/static/ {
            proxy_pass http://nextjs/_next/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Public assets
        location /public/ {
            proxy_pass http://nextjs/public/;
            expires 30d;
        }
    }

    # HTTPS server (раскомментируйте когда настроите SSL с certbot)
    # server {
    #     listen 443 ssl http2;
    #     server_name fatiha.ru www.fatiha.ru;
    #
    #     ssl_certificate /etc/letsencrypt/live/fatiha.ru/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/fatiha.ru/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
